[package]
name = "janitor-core"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Security-critical core for Janitor: secret-shape model, zeroizing types, and config."

[dependencies]
async-trait = "0.1"
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
directories = "5"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros"] }
