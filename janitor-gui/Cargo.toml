[package]
name = "janitor-gui"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Janitor's thin Slint view over janitor-core (ADR 0003)."
build = "build.rs"

[dependencies]
janitor-core = { path = "../janitor-core" }
janitor-aws = { path = "../janitor-aws" }
janitor-mock = { path = "../janitor-mock" }
slint = "1"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
# OS clipboard for copy-Entry-name (#40, ADR 0005). Only Entry names (metadata)
# are ever placed on the clipboard — never Values.
arboard = "3"
tracing = "0.1"
tracing-subscriber = "0.3"

[build-dependencies]
slint-build = "1"

[dev-dependencies]
# Internal Slint crate (no semver guarantee) — pinned to match slint 1.16.1.
# Provides the headless testing backend + ElementHandle query API (ADR 0021).
i-slint-backend-testing = "=1.16.1"
