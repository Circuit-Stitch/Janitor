[package]
name = "janitor-aws-auth"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Janitor's shared AWS Identity Center access layer: browser Sign-in, account/role catalog, and credential brokering (ADR 0024)."

[features]
# Exposes `wire::fakes` (the front-half test doubles) to dependent crates'
# tests without shipping them in normal builds. `janitor-aws` enables this in
# its dev-dependencies so the relocated broker/source/session tests can reuse
# the fakes; the base's own tests reach them via the `test` cfg (see `wire`).
test-support = []

[dependencies]
janitor-core = { path = "../janitor-core" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
aws-config = "1"
aws-sdk-ssooidc = "1"
aws-sdk-sso = "1"
aws-smithy-runtime-api = "1"
aws-smithy-types = "1"
secrecy = "0.10"
zeroize = { version = "1", features = ["derive"] }
thiserror = "2"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
open = "5"
async-trait = "0.1"
tracing = "0.1"

# macOS Sign-in browser via `ASWebAuthenticationSession` (ADR 0033): the native
# ephemeral-session opener and its `aswebauth-spike` bin. Target-gated so non-macOS
# builds never pull objc2. Pinned to the objc2 0.6 / framework 0.3 train already
# resolved in Cargo.lock — no new major version introduced.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
dispatch2 = "0.3"
objc2-foundation = { version = "0.3", features = ["NSString", "NSURL", "NSError"] }
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSResponder", "NSWindow", "NSRunningApplication"] }
objc2-authentication-services = { version = "0.3", features = ["ASWebAuthenticationSession", "block2"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "io-util", "time", "test-util"] }
# Replay-transport shell coverage (ADR 0027): StaticReplayClient drives the real
# ssooidc/sso SDK clients against canned HTTP, so aws_impl's SDK-wrap + error
# mapping run in CI without live AWS. `http` builds the canned request/response
# pairs. Never compiled into a normal build. (`aws-smithy-types`, for `SdkBody`,
# is already a normal dependency above.)
aws-smithy-http-client = { version = "1", features = ["test-util"] }
http = "1"
