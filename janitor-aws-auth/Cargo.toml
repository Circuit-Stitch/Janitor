[package]
name = "janitor-aws-auth"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Janitor's shared AWS Identity Center access layer: browser Sign-in, account/role catalog, and credential brokering (ADR 0024)."

[features]
# Exposes `wire::fakes` (the front-half test doubles) to dependent crates'
# tests without shipping them in normal builds. `janitor-aws` enables this in
# its dev-dependencies so the relocated broker/source/session tests can reuse
# the fakes; the base's own tests reach them via the `test` cfg (see `wire`).
test-support = []

[dependencies]
janitor-core = { path = "../janitor-core" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
aws-config = "1"
aws-sdk-ssooidc = "1"
aws-sdk-sso = "1"
aws-smithy-runtime-api = "1"
aws-smithy-types = "1"
secrecy = "0.10"
zeroize = { version = "1", features = ["derive"] }
thiserror = "2"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
open = "5"
async-trait = "0.1"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "time", "test-util"] }
