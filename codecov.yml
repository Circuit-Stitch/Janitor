# Codecov is display-only for this repo — the ≥80% gates are enforced in CI by
# `cargo llvm-cov --fail-under-lines` (ADR 0016). Turn off Codecov's own status
# checks and PR comments so it can never become a second, externally-hosted gate.
coverage:
  status:
    project: false
    patch: false

comment: false

# Per-crate flags back the README badges. Paths scope each flag to its crate.
# janitor-app carries no flag: it is the worker's I/O loop and the AWS
# composition root, ungated by design (ADR 0035, Amendment 2026-08-21).
flags:
  core:
    paths:
      - janitor-core/
  aws:
    paths:
      - janitor-aws/
  aws-auth:
    paths:
      - janitor-aws-auth/
  mock:
    paths:
      - janitor-mock/
  ssm:
    paths:
      - janitor-ssm/
