name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt + clippy + test + coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable) with rustfmt, clippy, llvm-tools
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview

      # janitor-gui (Slint) links system libraries at build time; the workspace
      # clippy/build below needs them on the headless runner (ADR 0007).
      - name: Install Slint Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfontconfig1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets --all-features -- -D warnings

      # Run every crate's tests, including janitor-aws's brokering / orchestration
      # / error unit tests (driven by fakes — no real AWS). This is the functional
      # gate for the whole workspace; the coverage gate below stays core-only.
      - name: Test (workspace)
        run: cargo test --workspace

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      # janitor-aws is exercised by `cargo test --workspace` above but is NOT
      # line-gated: its browser / loopback / SDK shell is untestable by design
      # (ADR 0010 §5), so a blanket gate would fail on those shell lines. The
      # tested logic is proven by its unit tests; the 80% line gate stays on core.
      - name: Test with coverage (janitor-core ≥80% lines)
        run: cargo llvm-cov --package janitor-core --all-features --fail-under-lines 80
