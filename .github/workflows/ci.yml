name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt + clippy + test + coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust (stable) with rustfmt, clippy, llvm-tools
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview

      # janitor-gui (Slint) links system libraries at build time; the workspace
      # clippy/build below needs them on the headless runner (ADR 0007).
      - name: Install Slint Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfontconfig1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets --all-features -- -D warnings

      # Run every crate's tests, including janitor-aws's brokering / orchestration
      # / error unit tests (driven by fakes — no real AWS). This is the functional
      # gate for the whole workspace; the coverage gate below stays core-only.
      - name: Test (workspace)
        run: cargo test --workspace

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      # Per-crate coverage gates, enforced here (not by Codecov) so build
      # pass/fail stays inside this workflow — ADR 0016. Each run gates ≥80% and
      # emits an lcov for the badge. janitor-gui is excluded (thin view, no
      # secret logic — ADR 0003). janitor-aws is gated on its *library* surface:
      # `src/bin/` holds the run-on-demand harnesses (live-verify, loopback-spike,
      # 0% by design), so they're dropped; the untestable SDK shell stays in.
      - name: Coverage — janitor-core (≥80% lines)
        run: cargo llvm-cov --package janitor-core --all-features --fail-under-lines 80 --lcov --output-path lcov-core.info

      - name: Coverage — janitor-aws library (≥80% lines)
        run: cargo llvm-cov --package janitor-aws --all-features --ignore-filename-regex 'src/bin/' --fail-under-lines 80 --lcov --output-path lcov-aws.info

      # janitor-mock is the offline Provider — it ships in the binary (it *is*
      # offline mode), so it carries the same ≥80% gate as core/aws (ADR 0019).
      - name: Coverage — janitor-mock (≥80% lines)
        run: cargo llvm-cov --package janitor-mock --all-features --fail-under-lines 80 --lcov --output-path lcov-mock.info

      # janitor-ssm is the second real Provider (the remote-.env-over-SSM crate,
      # ADR 0025). Today it holds only the pure `parse_dotenv`; `src/bin/` is
      # dropped to match the aws gate for the human-gated harness that lands later.
      - name: Coverage — janitor-ssm (≥80% lines)
        run: cargo llvm-cov --package janitor-ssm --all-features --ignore-filename-regex 'src/bin/' --fail-under-lines 80 --lcov --output-path lcov-ssm.info

      # janitor-aws-auth is the shared Identity Center auth base (ADR 0024), gated
      # on its *library* surface like janitor-aws. It has no src/bin/ harnesses,
      # but it carries the ADR 0010 §5 SDK/browser shell
      # (authenticator/aws_impl/loopback) which — post-split — is no longer diluted
      # by the Secrets-Manager tail. Per the owner decision (2026-06-06) the 80%
      # gate was KEPT, not weakened. ADR 0027 then closed the gap the honest way:
      # the shell is now covered in CI by replay-transport + local-socket tests
      # (a StaticReplayClient drives the real ssooidc/sso clients; the loopback
      # listener is driven by a local TcpStream), with an env-gated live-AWS suite
      # (tests/live_aws.rs) confirming the canned shapes against a real org. So
      # this step is GREEN (~89% lines); #61's coverage blocker is closed. Ordered
      # LAST so a failure here doesn't skip the other gates.
      - name: Coverage — janitor-aws-auth library (≥80% lines)
        run: cargo llvm-cov --package janitor-aws-auth --all-features --ignore-filename-regex 'src/bin/' --fail-under-lines 80 --lcov --output-path lcov-aws-auth.info

      # Display-only upload (ADR 0016): renders the README badges. A missing
      # token or Codecov outage leaves badges stale but never fails the build —
      # the gates above already passed. Per-crate flags keep the badges distinct.
      - name: Upload janitor-core coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov-core.info
          flags: core
          fail_ci_if_error: false

      - name: Upload janitor-aws coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov-aws.info
          flags: aws
          fail_ci_if_error: false

      - name: Upload janitor-aws-auth coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov-aws-auth.info
          flags: aws-auth
          fail_ci_if_error: false

      - name: Upload janitor-mock coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov-mock.info
          flags: mock
          fail_ci_if_error: false

      - name: Upload janitor-ssm coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov-ssm.info
          flags: ssm
          fail_ci_if_error: false
