name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt + clippy + test + coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable) with rustfmt, clippy, llvm-tools
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview

      # janitor-gui (Slint) links system libraries at build time; the workspace
      # clippy/build below needs them on the headless runner (ADR 0007).
      - name: Install Slint Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfontconfig1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets --all-features -- -D warnings

      # Run every crate's tests, including janitor-aws's brokering / orchestration
      # / error unit tests (driven by fakes — no real AWS). This is the functional
      # gate for the whole workspace; the coverage gate below stays core-only.
      - name: Test (workspace)
        run: cargo test --workspace

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      # Per-crate coverage gates, enforced here (not by Codecov) so build
      # pass/fail stays inside this workflow — ADR 0016. Each run gates ≥80% and
      # emits an lcov for the badge. janitor-gui is excluded (thin view, no
      # secret logic — ADR 0003). janitor-aws is gated on its *library* surface:
      # `src/bin/` holds the run-on-demand harnesses (live-verify, loopback-spike,
      # 0% by design), so they're dropped; the untestable SDK shell stays in.
      - name: Coverage — janitor-core (≥80% lines)
        run: cargo llvm-cov --package janitor-core --all-features --fail-under-lines 80 --lcov --output-path lcov-core.info

      - name: Coverage — janitor-aws library (≥80% lines)
        run: cargo llvm-cov --package janitor-aws --all-features --ignore-filename-regex 'src/bin/' --fail-under-lines 80 --lcov --output-path lcov-aws.info

      # Display-only upload (ADR 0016): renders the two README badges. A missing
      # token or Codecov outage leaves badges stale but never fails the build —
      # the gates above already passed. Per-crate flags keep the badges distinct.
      - name: Upload janitor-core coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov-core.info
          flags: core
          fail_ci_if_error: false

      - name: Upload janitor-aws coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov-aws.info
          flags: aws
          fail_ci_if_error: false
