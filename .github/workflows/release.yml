# Desktop release (ADR 0022, #55). Builds the installable packages on native
# per-OS runners and attaches them to a **draft** GitHub Release for human review.
# Unlike a JVM app, a Rust/Slint binary is native per-platform, so this is a
# per-OS matrix (no single-runner cross-build); the packaging tools are the
# Rust-native ones ADR 0022 chose:
#   * cargo-generate-rpm — Fedora-native .rpm (the priority install target).
#   * cargo-packager      — .deb + .AppImage (Linux) and .dmg (macOS).
#
# Two ways to cut a release (both end at a DRAFT you review + Publish):
#   * One-click (preferred): Actions → Release → "Run workflow" → type the
#     version (e.g. 0.1.4). The `setup` job bumps janitor-gui/Cargo.toml, commits
#     it to main, and the SAME run builds + drafts the release off that commit.
#   * Manual: bump janitor-gui/Cargo.toml yourself, then
#     `git tag v0.1.0 && git push origin v0.1.0`.
# `vX.Y.Z` MUST equal janitor-gui's crate version (verify-version fails a tag push
# otherwise; the one-click path keeps them equal by construction). A DRAFT defers
# git-tag creation until you Publish, so a failed build never leaves a dangling tag.
#
# Windows ships an **MSIX** (auto-updating via App Installer, ADR 0034) — assembled
# with `makeappx` and signed by Azure Trusted Signing, NOT cargo-packager NSIS. It
# is **skip-gated** on the `WINDOWS_SIGNING_ENABLED` repo variable: while it is unset
# the job is *skipped* (run stays green) and NO unsigned .msix is ever produced —
# the hard policy from ADR 0022. macOS is built **unsigned** for now
# (Gatekeeper will warn on first open); Developer ID + notarization is #57 — see
# the ADR 0022 amendment.
#
# `workflow_dispatch` with an EMPTY version is a **dry-run**: it builds + uploads
# the artifacts but drafts no Release (handy for validating a packaging change).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version X.Y.Z (no leading v). Leave EMPTY for a dry-run build with no Release."
        required: false
        type: string

# The setup + release jobs write to the repo (push the bump commit; create the
# draft Release); the built-in GITHUB_TOKEN is read-only by default, so grant
# contents:write here. Build jobs override this to read-only per job.
permissions:
  contents: write

# Never cancel an in-flight release; serialize per ref.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # One-click front end. On a `workflow_dispatch` with a version it bumps
  # janitor-gui/Cargo.toml to that exact version, commits it to main, and hands
  # the resulting SHA to every downstream job so they build the bumped tree (NOT
  # pre-dispatch main). It deliberately does NOT create a git tag — the draft
  # Release creates it at Publish time (target_commitish), so a failed build
  # leaves no dangling tag and the run is safely re-runnable. Outputs:
  #   ref         — the git ref/SHA every other job checks out
  #   tag         — the release name / tag_name (vX.Y.Z); empty on a dry-run
  #   do_release  — "true" when a draft Release should be produced
  #
  # NOTE: the bump commit is pushed with GITHUB_TOKEN, which by design does NOT
  # trigger another workflow run (no ci.yml on the bump, no recursive release) —
  # the whole release happens in this single run. A version-string bump landing on
  # main un-CI'd is acceptable.
  setup:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
      tag: ${{ steps.resolve.outputs.tag }}
      do_release: ${{ steps.resolve.outputs.do_release }}
    steps:
      - uses: actions/checkout@v5
      - id: resolve
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${VERSION}" ]; then
            echo "${VERSION}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' \
              || { echo "::error::version must be X.Y.Z with no leading 'v' (got '${VERSION}')"; exit 1; }
            # Idempotent bump: only commit when the version actually changes, so a
            # re-run after a flaky build just rebuilds the same SHA instead of
            # failing on "nothing to commit".
            sed -i -E "0,/^version[[:space:]]*=.*/s//version = \"${VERSION}\"/" janitor-gui/Cargo.toml
            if git diff --quiet -- janitor-gui/Cargo.toml; then
              echo "janitor-gui already at ${VERSION} — no bump commit"
            else
              git config user.name  "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add janitor-gui/Cargo.toml
              git commit -m "ci(release): bump janitor-gui to ${VERSION}"
              git push origin "HEAD:${{ github.ref_name }}"
            fi
            {
              echo "ref=$(git rev-parse HEAD)"
              echo "tag=v${VERSION}"
              echo "do_release=true"
            } >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Dry-run: build main as-is, no bump, no Release.
            {
              echo "ref=${{ github.ref }}"
              echo "tag="
              echo "do_release=false"
            } >> "$GITHUB_OUTPUT"
          else
            # Real `v*` tag push: build + draft for that existing tag.
            {
              echo "ref=${{ github.ref }}"
              echo "tag=${{ github.ref_name }}"
              echo "do_release=true"
            } >> "$GITHUB_OUTPUT"
          fi

  # Guard the single version source of truth: a pushed `vX.Y.Z` tag must equal
  # janitor-gui's crate version, so a forgotten version bump can't publish a
  # Release whose name disagrees with the binary. A no-op on workflow_dispatch
  # (no tag to check) — the one-click path bumps Cargo.toml to the typed version,
  # so it agrees by construction.
  verify-version:
    name: Verify tag matches crate version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Assert tag == janitor-gui version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          crate_ver="$(grep -m1 -E '^version[[:space:]]*=' janitor-gui/Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          tag_ver="${GITHUB_REF_NAME#v}"
          echo "crate version: '${crate_ver}'  ·  pushed tag: '${GITHUB_REF_NAME}' (-> '${tag_ver}')"
          if [ "${crate_ver}" != "${tag_ver}" ]; then
            echo "::error::Tag '${GITHUB_REF_NAME}' does not match janitor-gui version '${crate_ver}'. Bump janitor-gui/Cargo.toml to ${tag_ver} (or re-tag v${crate_ver}), then push again."
            exit 1
          fi

  # Fedora-native rpm (priority target). Built in a fedora:latest container so the
  # explicit `Requires` (fontconfig / libxkbcommon / libxcb / mesa-libGL) resolve
  # against the real Fedora package names. `git` must be installed BEFORE checkout
  # (the bare image has none); the container runs as root, so no sudo.
  linux-rpm:
    name: Linux .rpm (Fedora)
    needs: [verify-version, setup]
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Install toolchain + Slint/X build deps (Fedora)
        run: |
          dnf -y install \
            git gcc gcc-c++ pkgconf-pkg-config \
            rust cargo \
            fontconfig-devel libxkbcommon-devel libxcb-devel mesa-libGL-devel
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.setup.outputs.ref }}
      - name: Build release binary
        run: cargo build --release -p janitor-gui
      - name: Install cargo-generate-rpm
        run: cargo install cargo-generate-rpm --locked
      - name: Build rpm
        # `source` paths in [package.metadata.generate-rpm] are workspace-root
        # relative, so run from the root. Output: target/generate-rpm/*.rpm.
        run: cargo generate-rpm -p janitor-gui
      - uses: actions/upload-artifact@v4
        with:
          name: linux-rpm
          path: target/generate-rpm/*.rpm
          if-no-files-found: error

  # deb + AppImage on ubuntu-22.04 (old-glibc floor for portability). AppImage
  # downloads appimagetool at package time, so the job needs network (default).
  linux-portable:
    name: Linux .deb + .AppImage
    needs: [verify-version, setup]
    runs-on: ubuntu-22.04
    # GitHub runners have no FUSE, so appimagetool must self-extract instead of
    # mounting its own AppImage — the standard CI workaround.
    env:
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.setup.outputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Slint Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfontconfig1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-packager
        run: cargo install cargo-packager --locked
      - name: Package deb + AppImage
        # cargo-packager runs its own `before-packaging-command` (the release
        # build). --out-dir is resolved relative to the package manifest dir, so
        # the bundles land in janitor-gui/dist/. Formats are COMMA-separated:
        # cargo-packager has subcommands, so `--formats deb appimage` makes clap
        # read `appimage` as a subcommand ("unrecognized subcommand").
        run: cargo packager -p janitor-gui --release --formats deb,appimage --out-dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: linux-portable
          path: |
            janitor-gui/dist/*.deb
            janitor-gui/dist/*.AppImage
          if-no-files-found: error

  # macOS .dmg, built UNSIGNED for now (#57 wires Developer ID + notarization;
  # until then Gatekeeper warns on first open — acceptable for a draft Release
  # reviewed by a human, not auto-published). macos-latest is Apple Silicon; an
  # Intel/universal build is a follow-up.
  macos:
    name: macOS .dmg (unsigned)
    needs: [verify-version, setup]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.setup.outputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-packager
        run: cargo install cargo-packager --locked
      - name: Package dmg
        run: cargo packager -p janitor-gui --release --formats dmg --out-dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: janitor-gui/dist/*.dmg
          if-no-files-found: error

  # Windows MSIX — SKIP-GATED on the WINDOWS_SIGNING_ENABLED repo variable. While
  # it is unset this whole job is skipped (the run stays green) so NO unsigned .msix
  # is ever built or uploaded (ADR 0022 hard policy). The package is assembled with
  # `makeappx` (Windows SDK) from janitor-gui/msix/AppxManifest.xml + the built exe
  # + icons, then signed by Azure Trusted Signing (OIDC-federated, no stored
  # secret). A companion .appinstaller (manual-update-only, NO background checks —
  # ADR 0034) is uploaded alongside. cargo-packager is NOT used on Windows.
  windows:
    name: Windows MSIX (signed)
    needs: [verify-version, setup]
    runs-on: windows-latest
    if: vars.WINDOWS_SIGNING_ENABLED == 'true'
    # Run in the `release` environment so the OIDC subject is
    # `repo:OWNER/REPO:environment:release` (trigger-independent) — one Azure
    # federated credential then covers every release tag, and the same subject
    # can be smoke-tested via workflow_dispatch (oidc-smoke.yml) without a build.
    environment: release
    # OIDC token for Azure federated login — no client secret is ever stored.
    # Job-level perms override the workflow default; this job only reads source.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.setup.outputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --release -p janitor-gui
      # Assemble the MSIX pack layout: the exe + named logos at the manifest's
      # referenced paths + AppxManifest.xml at the layout root, plus the companion
      # .appinstaller. @VERSION@ -> the 4-part MSIX version (crate X.Y.Z -> X.Y.Z.0);
      # verify-version already guarantees the crate version equals the tag.
      - name: Assemble MSIX layout
        shell: pwsh
        run: |
          $ver = (Select-String -Path janitor-gui/Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          $ver4 = "$ver.0"
          Write-Host "MSIX version: $ver4"
          $layout = "janitor-gui/dist/msix"
          New-Item -ItemType Directory -Force -Path "$layout/Images" | Out-Null
          Copy-Item target/release/janitor-gui.exe "$layout/janitor-gui.exe"
          Copy-Item janitor-gui/assets/icons/48.png  "$layout/Images/Square44x44Logo.png"
          Copy-Item janitor-gui/assets/icons/256.png "$layout/Images/Square150x150Logo.png"
          Copy-Item janitor-gui/assets/icons/48.png  "$layout/Images/StoreLogo.png"
          (Get-Content janitor-gui/msix/AppxManifest.xml -Raw) -replace '@VERSION@', $ver4 | Set-Content -NoNewline "$layout/AppxManifest.xml"
          (Get-Content janitor-gui/msix/Janitor.appinstaller -Raw) -replace '@VERSION@', $ver4 | Set-Content -NoNewline "janitor-gui/dist/Janitor.appinstaller"
      - name: Pack MSIX (makeappx)
        shell: pwsh
        run: |
          $makeappx = (Get-ChildItem "C:/Program Files (x86)/Windows Kits/10/bin/*/x64/makeappx.exe" | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          if (-not $makeappx) { throw "makeappx.exe not found in the Windows SDK" }
          Write-Host "Using $makeappx"
          & $makeappx pack /d janitor-gui/dist/msix /p janitor-gui/dist/Janitor.msix /o
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # Sign the .msix (the .appinstaller is a plaintext pointer — App Installer
      # validates the referenced .msix's Authenticode signature, so it is not signed).
      # Trusted Signing signs MSIX directly; the manifest Publisher must already equal
      # the cert Subject (load-bearing, ADR 0034 Decision 4) or this step rejects it.
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Sign MSIX (Azure Trusted Signing)
        uses: azure/trusted-signing-action@v0
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\janitor-gui\dist
          files-folder-filter: msix
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            janitor-gui/dist/*.msix
            janitor-gui/dist/*.appinstaller
          if-no-files-found: error

  # Publish: download every built artifact and attach it to a DRAFT GitHub Release.
  # Runs when `setup` says do_release (a real `v*` tag, or a one-click dispatch with
  # a version) — NOT on an empty-version dry-run. always() so a *skipped* Windows
  # job doesn't block it, but a *failed* build job does — Linux + macOS must succeed.
  # For a one-click dispatch the tag does not exist yet: a DRAFT defers git-tag
  # creation, and target_commitish points it at the bump commit, so the tag is
  # created at the SHA only when you click Publish.
  release:
    name: Draft GitHub Release
    needs: [setup, verify-version, linux-rpm, linux-portable, macos, windows]
    if: >-
      ${{ always()
        && needs.setup.outputs.do_release == 'true'
        && needs.verify-version.result == 'success'
        && needs.linux-rpm.result == 'success'
        && needs.linux-portable.result == 'success'
        && needs.macos.result == 'success'
        && (needs.windows.result == 'success' || needs.windows.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create draft Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: ${{ needs.setup.outputs.tag }}
          tag_name: ${{ needs.setup.outputs.tag }}
          # One-click dispatch: the tag doesn't exist yet, so create it at the bump
          # commit when published. Ignored on a real tag push (tag already exists).
          target_commitish: ${{ needs.setup.outputs.ref }}
          # The gated Windows job is normally skipped, so the *.msix/*.appinstaller
          # globs match nothing — don't fail on that. Linux/macOS artifacts are
          # guaranteed present by the upload steps' `if-no-files-found: error` (a
          # missing one fails that build job, which blocks this release via the
          # needs gate).
          fail_on_unmatched_files: false
          files: |
            artifacts/**/*.rpm
            artifacts/**/*.deb
            artifacts/**/*.AppImage
            artifacts/**/*.dmg
            artifacts/**/*.msix
            artifacts/**/*.appinstaller
