# ponytail: fast auth smoke for the Azure signing OIDC federated credential.
# The real Windows job is a ~17-min build; this verifies ONLY the azure/login
# token exchange in ~30s, with no tag and no build. It runs in the `release`
# environment so its OIDC subject (repo:OWNER/REPO:environment:release) is
# identical to the Windows release job's — if this is green, signing auth works.
# Run:  gh workflow run oidc-smoke.yml
# Delete once Windows signing is confirmed stable.
name: OIDC smoke

# Push-triggered on the signing branch so it's verifiable WITHOUT being on the
# default branch (workflow_dispatch only dispatches from default). Remove the
# push trigger (keep workflow_dispatch) before merging to main.
on:
  push:
    branches: [ci/windows-signing]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  login:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Prove the token works
        run: az account show -o table
